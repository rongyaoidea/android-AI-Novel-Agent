<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI 小说工作台 · android-AI-Novel-Agent</title>
<link rel="stylesheet" href="/app.css" />
</head>
<body>
<div class="layout">

  <aside class="sidebar">
    <div class="brand">
      <div class="brand-icon">📖</div>
      <div>
        <div class="brand-title">AI 小说工作台</div>
        <div class="brand-sub">android-AI-Novel-Agent</div>
      </div>
    </div>
    <nav class="nav">
      <div class="nav-group-label">创作</div>
      <a class="nav-item" data-route="#/shelf" href="#/shelf">书架</a>
      <a class="nav-item" data-route="#/create" href="#/create">新建作品</a>
      <div class="nav-group-label">系统</div>
      <a class="nav-item" data-route="#/runs" href="#/runs">运行记录</a>
      <a class="nav-item" data-route="#/settings" href="#/settings">模型设置</a>
    </nav>
    <div class="sidebar-foot">
      <span class="dot" id="engine-dot"></span>
      <span id="engine-status">连接中…</span>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="page-head">
        <h1 id="page-title">书架</h1>
        <p id="page-subtitle">管理你的作品与创作进度</p>
      </div>
      <div class="topbar-right">
        <button class="btn btn-outline btn-sm" id="theme-toggle">切换主题</button>
        <a class="chip chip-model" id="model-chip" href="#/settings" title="前往模型设置">模型：—</a>
      </div>
    </header>

    <main class="content">

      <!-- 书架 -->
      <section class="view" id="view-shelf" hidden>
        <div class="page-actions">
          <button class="btn btn-primary" id="shelf-create">创建新小说</button>
          <button class="btn btn-outline" id="shelf-refresh">刷新</button>
        </div>
        <div class="chips" id="shelf-filters"></div>
        <div class="novel-grid" id="shelf-grid"></div>
      </section>

      <!-- 新建作品 -->
      <section class="view" id="view-create" hidden>
        <div class="flow-chips">
          <span class="chip chip-dark">1 立项方案</span><span class="muted">→</span>
          <span class="chip">2 章节规划</span><span class="muted">→</span>
          <span class="chip">3 正文生成</span><span class="muted">→</span>
          <span class="chip">4 章节审校</span><span class="muted">→</span>
          <span class="chip">5 保存与导出</span>
        </div>
        <form id="create-form" style="max-width:720px;">
          <div class="field">
            <label for="create-idea">一句灵感</label>
            <textarea id="create-idea" rows="4" placeholder="例如：一个能听见鲸歌的少年，在深海城市里寻找失踪的姐姐。"></textarea>
          </div>
          <div class="field-row">
            <div class="field">
              <label for="create-chapters">生成章节数</label>
              <input id="create-chapters" type="number" min="1" max="50" value="3" />
            </div>
            <div class="field">
              <label>当前模型</label>
              <div class="static-value" id="create-model">—</div>
            </div>
          </div>
          <div class="row">
            <button class="btn btn-primary" type="submit" id="create-submit">开始创作</button>
            <span class="muted">AI 会先生成方案与规划，再逐章写作；可在「模型设置」中切换模型。</span>
          </div>
        </form>
      </section>

      <!-- 本书工作台 -->
      <section class="view" id="view-novel" hidden>
        <div class="novel-head">
          <div class="novel-head-main">
            <h2 id="novel-title">—</h2>
            <div class="chips" id="novel-chips"></div>
            <p class="muted" id="novel-meta"></p>
          </div>
          <div class="novel-head-actions">
            <input id="novel-target" class="input-sm" type="number" min="1" max="50" title="目标章节数" />
            <button class="btn btn-primary" id="novel-run">继续创作</button>
            <a class="btn btn-outline" id="novel-export" href="#">导出 TXT</a>
            <button class="btn btn-ghost btn-danger" id="novel-delete">删除</button>
          </div>
        </div>

        <div class="panel">
          <div class="panel-head">
            <h3 class="panel-title">创作进度</h3>
            <span class="chips" id="run-chips"></span>
          </div>
          <div class="progress"><div class="progress-fill" id="run-progress"></div></div>
          <p class="muted" id="run-note" style="margin:0;"></p>
          <div class="steps" id="novel-steps"></div>
        </div>

        <div class="grid-2">
          <div class="panel">
            <div class="panel-head">
              <h3 class="panel-title">跟随生成 <span class="live-dot" id="stream-live" title="正在接收生成内容"></span></h3>
              <button class="btn btn-outline btn-sm" id="stream-clear">清空</button>
            </div>
            <pre class="stream muted" id="stream-pre">等待生成…</pre>
          </div>
          <div class="panel">
            <div class="panel-head"><h3 class="panel-title">运行日志</h3></div>
            <div class="log" id="novel-log"></div>
          </div>
        </div>

        <div class="panel">
          <div class="panel-head"><h3 class="panel-title">章节</h3></div>
          <div class="table-wrap">
            <table class="table">
              <thead>
                <tr><th>#</th><th>标题</th><th>状态</th><th>字数</th><th>审校</th><th></th></tr>
              </thead>
              <tbody id="chapter-rows"></tbody>
            </table>
          </div>
        </div>
      </section>

      <!-- 运行记录 -->
      <section class="view" id="view-runs" hidden>
        <div class="table-wrap">
          <table class="table">
            <thead>
              <tr><th>时间</th><th>作品</th><th>目标</th><th>进度</th><th>状态</th><th>阶段</th><th>备注</th></tr>
            </thead>
            <tbody id="runs-rows"></tbody>
          </table>
        </div>
      </section>

      <!-- 模型设置 -->
      <section class="view" id="view-settings" hidden>
        <form id="settings-form" style="max-width:700px;">
          <div class="field">
            <label for="set-provider">提供方</label>
            <select id="set-provider">
              <option value="mock">离线演示（mock，无需网络）</option>
              <option value="openai">OpenAI 兼容接口</option>
            </select>
          </div>
          <div class="field">
            <label for="set-base">Base URL</label>
            <input id="set-base" placeholder="https://api.deepseek.com/v1" />
          </div>
          <div class="field-row">
            <div class="field">
              <label for="set-key">API Key</label>
              <input id="set-key" type="password" placeholder="sk-…（仅保存在本机）" />
            </div>
            <div class="field">
              <label for="set-model">模型</label>
              <input id="set-model" placeholder="deepseek-chat" />
            </div>
          </div>
          <div class="field" style="max-width:220px;">
            <label for="set-temp">temperature</label>
            <input id="set-temp" type="number" step="0.1" min="0" max="2" />
          </div>
          <div class="row">
            <button class="btn btn-primary" type="submit">保存</button>
            <button class="btn btn-outline" type="button" id="set-test">测试连接</button>
            <span class="muted" id="set-status"></span>
          </div>
        </form>
        <div class="presets" style="max-width:700px;">
          <span class="muted">快速填充：</span>
          <button class="btn btn-outline btn-sm" data-preset="deepseek">DeepSeek</button>
          <button class="btn btn-outline btn-sm" data-preset="qwen">通义千问</button>
          <button class="btn btn-outline btn-sm" data-preset="glm">智谱 GLM</button>
          <button class="btn btn-outline btn-sm" data-preset="ollama">Ollama 本地</button>
        </div>
      </section>

    </main>
  </div>
</div>

<!-- 章节阅读浮层 -->
<div class="dialog-backdrop" id="reader-backdrop" hidden>
  <div class="dialog">
    <div class="dialog-head">
      <h3 id="reader-title">章节</h3>
      <button class="btn btn-ghost" id="reader-close">关闭</button>
    </div>
    <div class="chips" id="reader-review"></div>
    <p class="muted" id="reader-goal" style="margin:0;"></p>
    <pre class="reader-content" id="reader-content"></pre>
  </div>
</div>

<div class="toasts" id="toasts"></div>
<script src="/app.js"></script>
</body>
</html>
